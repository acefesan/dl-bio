name: Hygiene

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  hygiene:
    name: Markdown, notebooks, and Python hygiene
    runs-on: [self-hosted, linux, dl-bio-container]
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Check Git whitespace errors
        run: git diff --check

      - name: Lint Markdown
        run: markdownlint-cli2 "**/*.md" "#.venv" "#dlfb" "#notebooks"

      - name: Check local Markdown links
        run: lychee --offline --no-progress "**/*.md"

      - name: Validate notebooks
        run: |
          while IFS= read -r notebook; do
            jupyter nbconvert --to notebook --stdout "$notebook" > /dev/null
          done < <(find . \
            -path './.venv' -prune -o \
            -path './dlfb' -prune -o \
            -path './notebooks' -prune -o \
            -name '*.ipynb' -print)

      - name: Lint Python
        run: ruff check --select=E9,F63,F7,F82 .
